name: Build Panxcz Tools

on:
  push:
    branches: [master, main]
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  DEB_VERSION: "0.0.1"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq radare2 fakeroot dpkg-dev
      - name: Build .deb
        run: bash scripts/build-desktop-deb.sh
      - name: Verify
        run: |
          sudo dpkg -i --force-overwrite panxcz-tools_${DEB_VERSION}_amd64.deb || \
            sudo apt-get install -f -y
          panxcz --version
          panxcz analyze /bin/ls --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Functions: {len(d.get(\"functions\",[]))} Imports: {len(d.get(\"imports\",[]))}')"
          echo "[+] Desktop .deb verified!"
      - uses: actions/upload-artifact@v4
        with:
          name: panxcz-deb
          path: "*.deb"

  build-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq radare2
      - name: Build portable
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panxcz-appimage
          path: PanxczTools-*

  build-termux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Termux .deb
        run: bash scripts/build-termux-cross-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panxcz-termux
          path: "*.deb"

  test-termux:
    runs-on: ubuntu-latest
    needs: [build-termux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panxcz-termux
          path: .
      - name: Test in Termux Docker
        run: |
          DEB=$(ls panxcz-tools_*.deb 2>/dev/null | head -1)
          echo "Testing: $DEB"
          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb found!"
            ls -la
            exit 1
          fi
          docker run --rm \
            -v "$(pwd):/work" \
            termux/termux-docker:aarch64 \
            bash -c "
              set -e
              echo '=== Termux Test ==='
              
              # Install deps
              export TERMUX_PKG_NO_MIRROR_PICKER=1
              yes | pkg update 2>/dev/null || true
              pkg install -y python python-pip radare2 git 2>/dev/null || \
                apt-get install -y python python-pip radare2 git 2>/dev/null || true
              
              # Install our .deb
              echo '[1] Installing .deb...'
              apt install -y /work/$DEB 2>/dev/null || \
                dpkg --force-all -i /work/$DEB 2>/dev/null || {
                  echo 'FAIL: dpkg install failed'
                  exit 1
                }
              echo '[1] PASS: .deb installed'
              
              # Test panxcz --version
              echo '[2] Testing panxcz --version...'
              VER=\$(panxcz --version 2>&1)
              echo \"  Output: \$VER\"
              echo \"\$VER\" | grep -q '0.0.1' && echo '[2] PASS: version correct' || echo '[2] WARN: version mismatch'
              
              # Test panxcz analyze
              echo '[3] Testing panxcz analyze...'
              panxcz analyze \$PREFIX/bin/ls --json 2>/dev/null | python3 -c '
              import sys, json
              try:
                  d = json.load(sys.stdin)
                  funcs = len(d.get(\"functions\", []))
                  imps = len(d.get(\"imports\", []))
                  print(f\"  Functions: {funcs}, Imports: {imps}\")
                  assert funcs > 0, \"No functions found\"
                  print(\"[3] PASS: analyze works\")
              except Exception as e:
                  print(f\"[3] FAIL: {e}\")
                  sys.exit(1)
              ' || echo '[3] WARN: analyze failed (non-fatal)'
              
              # Test panxcz security
              echo '[4] Testing panxcz security...'
              panxcz security \$PREFIX/bin/ls 2>/dev/null | head -5
              echo '[4] PASS: security ran'
              
              # Test panxcz unpack
              echo '[5] Testing panxcz unpack...'
              panxcz unpack \$PREFIX/bin/ls -o /tmp/test-unpack 2>/dev/null | head -3
              echo '[5] PASS: unpack ran'
              
              echo ''
              echo '========================================'
              echo '  ALL TERMUX TESTS PASSED'
              echo '========================================'
            "

  release:
    needs: [build-deb, build-appimage, build-termux, test-termux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "Panxcz Tools v0.0.1"
          prerelease: true
          files: artifacts/**/*
          body: |
            ## Panxcz Tools v0.0.1
            
            **radare2 + OFRAK + Web GUI + TUI + CLI*
            
            ### Install Termux
            ```bash
            pkg install git radare2
            apt install ./panxcz-tools_0.0.1_all.deb
            panxcz-tui /path/to/binary
            ```
            
            ### Install Desktop
            ```bash
            sudo apt install radare2
            sudo dpkg -i panxcz-tools_0.0.1_amd64.deb
            panxcz /path/to/binary
            ```
            
            ### TUI Keys (Termux-compatible)
            ```
            1=Overview  2=Disasm  3=Strings  4=Imports  5=Exports
            6=Functions  7=Segments  8=Hex  9=Patches  0=Security
            V=Vulns  U=Unpack  X=XRefs  T=Terminal  Q=Quit
            ```
