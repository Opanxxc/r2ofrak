name: Build R2OFRAK Packages

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  DEB_VERSION: "0.1.0"

jobs:
  # ─── Desktop .deb (amd64) ──────────────────────────────────────────────
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq radare2 fakeroot dpkg-dev

      - name: Build .deb
        run: bash scripts/build-desktop-deb.sh

      - name: Verify .deb
        run: |
          echo "[*] Verifying..."
          sudo dpkg -i r2ofrak_${DEB_VERSION}_amd64.deb
          r2ofrak --version
          echo "[+] Desktop .deb verified!"

      - uses: actions/upload-artifact@v4
        with:
          name: r2ofrak-deb
          path: "*.deb"

  # ─── .AppImage (portable) ──────────────────────────────────────────────
  build-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq radare2

      - name: Build portable package
        run: bash scripts/build-appimage.sh

      - name: Verify
        run: |
          ls -lh R2OFRAK-*.tar.gz R2OFRAK-*.AppImage 2>/dev/null || true
          echo "[+] Portable package built!"

      - uses: actions/upload-artifact@v4
        with:
          name: r2ofrak-appimage
          path: R2OFRAK-*

  # ─── Termux .deb (cross-compiled pure Python) ───────────────────────────
  build-termux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Termux .deb (pure Python, arch-independent)
        run: bash scripts/build-termux-cross-deb.sh

      - name: Verify
        run: |
          ls -lh r2ofrak_*_all.deb 2>/dev/null
          echo "[+] Termux .deb built!"

      - uses: actions/upload-artifact@v4
        with:
          name: r2ofrak-termux-deb
          path: "*.deb"

  # ─── Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-deb, build-appimage, build-termux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "R2OFRAK Continuous Build"
          prerelease: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
          body: |
            ## R2OFRAK — Unified Reverse Engineering Platform
            
            Combines **radare2** + **OFRAK** into one tool.
            
            ### Packages
            - `r2ofrak_*_amd64.deb` — Desktop Debian/Ubuntu
            - `r2ofrak_*_all.deb` — Termux / Any arch (pure Python)
            - `R2OFRAK-*.tar.gz` — Universal portable
            
            ### Quick Start (Termux)
            ```bash
            pkg install git radare2
            apt install ./r2ofrak_*_all.deb
            r2ofrak-tui /path/to/binary
            ```
            
            ### Quick Start (Desktop)
            ```bash
            sudo apt install radare2
            sudo dpkg -i r2ofrak_*.deb
            r2ofrak analyze /path/to/binary
            ```
            
            ### TUI Mode
            ```bash
            r2ofrak-tui              # Interactive TUI
            r2ofrak-tui /bin/ls      # Open binary directly
            ```
