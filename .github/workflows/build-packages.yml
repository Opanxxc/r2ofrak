name: Build Panxcz Tools

on:
  push:
    branches: [master, main]
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  DEB_VERSION: "1.0.0"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq radare2 fakeroot dpkg-dev
      - name: Build .deb
        run: bash scripts/build-desktop-deb.sh
      - name: Verify
        run: |
          sudo dpkg -i --force-overwrite panxcz-tools_${DEB_VERSION}_amd64.deb || \
            sudo apt-get install -f -y
          panxcz --version
          panxcz-tui --help | head -1
          echo "[+] Verified!"
      - uses: actions/upload-artifact@v4
        with:
          name: panxcz-deb
          path: "*.deb"

  build-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq radare2
      - name: Build portable
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panxcz-appimage
          path: PanxczTools-*

  build-termux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Termux .deb
        run: bash scripts/build-termux-cross-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panxcz-termux
          path: "*.deb"

  release:
    needs: [build-deb, build-appimage, build-termux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "Panxcz Tools Continuous Build"
          prerelease: true
          files: artifacts/**/*
          body: |
            ## 🔬 Panxcz Tools — Unified Reverse Engineering Platform
            
            **radare2 + OFRAK + Web GUI + TUI + CLI*
            
            ### What's New in v1.0
            - 🖥️ **Web GUI** — iaito-style dark theme interface
            - 🖥️ **TUI** — Interactive terminal UI (16 tabs)
            - ⌨️ **CLI** — 10+ subcommands
            - 🔍 **Security analysis** — anti-debug, crypto, protections
            - 📱 **APK/DEX analyzer**
            - 🔧 **Firmware analyzer**
            - ⚖️ **Binary comparator**
            - 🎬 **Script recorder*
            
            ### Quick Start (Termux)
            ```bash
            pkg install git radare2
            apt install ./panxcz-tools_*_all.deb
            panxcz-gui /path/to/binary
            ```
            
            ### Quick Start (Desktop)
            ```bash
            sudo apt install radare2
            sudo dpkg -i panxcz-tools_*.deb
            panxcz-gui /path/to/binary
            ```
            
            ### Web GUI
            ```bash
            panxcz-gui /path/to/binary --port 8888
            # Open http://localhost:8888
            ```
