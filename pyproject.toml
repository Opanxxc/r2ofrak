[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "panxcz-tools"
version = "0.0.1"
description = "Panxcz Tools — Unified Reverse Engineering Platform (radare2 + OFRAK + Web GUI)"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.9"
authors = [
    {name = "Panxcz"},
]
keywords = ["reverse-engineering", "radare2", "ofrak", "binary-analysis", "disassembly", "gui", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Environment :: Console",
    "Environment :: Web Environment",
]

dependencies = [
    "r2pipe>=1.8.0",
    "textual>=0.40.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
full = [
    "r2pipe>=1.8.0",
    "textual>=0.40.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "ofrak>=3.0.0",
]
dev = ["pytest", "ruff"]

[project.scripts]
panxcz = "panxcz_tools.cli:main"
panxcz-gui = "panxcz_tools.gui.app:main"
panxcz-tui = "panxcz_tools.tui:main"

[project.urls]
Homepage = "https://github.com/Opanxxc/panxcz-tools"
Repository = "https://github.com/Opanxxc/panxcz-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"panxcz_tools.gui" = ["templates/*.html", "static/**/*.css", "static/**/*.js"]
